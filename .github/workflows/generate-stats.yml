name: Generate GitHub Stats

on:
  schedule:
    # Daily at 03:00 UTC (08:30 IST)
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate all profile cards (bespoke generator)
        # PAT_1 (repo secret, classic token) is required for private
        # contribution counts and full calendar data; the built-in
        # GITHUB_TOKEN cannot read user-level data.
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_1 || secrets.GITHUB_TOKEN }}
        run: python3 generator/generate_all.py

      - name: Commit and push generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          git commit -m "chore: update github stats [skip ci]" || exit 0
          git push
