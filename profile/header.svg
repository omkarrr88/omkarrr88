<rect x="599" y="92" width="2.5" height="17" fill="#7aa2f7" class="cursor"/>
</g>
<g class="phrase-3" style="opacity: 0;">
<text x="460" y="105" text-anchor="middle" font-family="'Cascadia Code', 'Fira Code', monospace" font-size="13" font-weight="400" fill="#7dcfff">ML Enthusiast &amp; Automation Builder</text>
<rect x="599" y="92" width="2.5" height="17" fill="#7aa2f7" class="cursor"/>
</g>
<g class="phrase-4" style="opacity: 0;">
<text x="460" y="105" text-anchor="middle" font-family="'Cascadia Code', 'Fira Code', monospace" font-size="13" font-weight="400" fill="#7dcfff">IT Engineer - Mumbai University &apos;26</text>
<rect x="602" y="92" width="2.5" height="17" fill="#7aa2f7" class="cursor"/>
</g>
<circle cx="328" cy="136" r="3.5" fill="#9ece6a" class="pulse-dot"/>
<text x="338" y="140" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif" font-size="11" font-weight="500" fill="#c0caf5">Available for work</text>
