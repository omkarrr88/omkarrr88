<svg width="920" height="160" viewBox="0 0 920 160" xmlns="http://www.w3.org/2000/svg">
<style>@keyframes fadeInUp {
  from {
    transform: translateY(6px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

@keyframes blink {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0; }
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

@keyframes type-0 {
  0% { opacity: 0; }
  0% { opacity: 0; }
  8% { opacity: 1; }
  13% { opacity: 1; }
  20% { opacity: 0; }
  100% { opacity: 0; }
}

@keyframes type-1 {
  0% { opacity: 0; }
  20% { opacity: 0; }
  28% { opacity: 1; }
  33% { opacity: 1; }
  40% { opacity: 0; }
  100% { opacity: 0; }
}

@keyframes type-2 {
  0% { opacity: 0; }
  40% { opacity: 0; }
  48% { opacity: 1; }
  53% { opacity: 1; }
  60% { opacity: 0; }
  100% { opacity: 0; }
}

@keyframes type-3 {
  0% { opacity: 0; }
  60% { opacity: 0; }
  68% { opacity: 1; }
  73% { opacity: 1; }
  80% { opacity: 0; }
  100% { opacity: 0; }
}

@keyframes type-4 {
  0% { opacity: 0; }
  80% { opacity: 0; }
  88% { opacity: 1; }
  93% { opacity: 1; }
  100% { opacity: 0; }
  100% { opacity: 0; }
}

.cursor { animation: blink 1s infinite; }
.pulse-dot { animation: pulse 2s infinite; }
.phrase-0 { animation: type-0 15s linear infinite; }
.phrase-1 { animation: type-1 15s linear infinite; }
.phrase-2 { animation: type-2 15s linear infinite; }
.phrase-3 { animation: type-3 15s linear infinite; }
.phrase-4 { animation: type-4 15s linear infinite; }</style>
<defs>
<linearGradient id="nameGradient" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" style="stop-color:#7aa2f7;stop-opacity:0.6" />
  <stop offset="100%" style="stop-color:#bb9af7;stop-opacity:0.6" />
</linearGradient>
</defs>
<text x="18" y="48" font-family="'Cascadia Code', 'Fira Code', monospace" font-size="20" font-weight="400" fill="#2f334d" opacity="0.6">&lt;/&gt;</text>
<text x="872" y="48" font-family="'Cascadia Code', 'Fira Code', monospace" font-size="20" font-weight="400" fill="#2f334d" opacity="0.6">{}</text>
<text x="460" y="50" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif" font-size="32" font-weight="700" fill="#7aa2f7">Omkar Kadam</text>
<rect x="320" y="58" width="280" height="3" fill="url(#nameGradient)" rx="1.5"/>
<g class="phrase-0" style="opacity: 1;">
<text x="460" y="105" text-anchor="middle" font-family="'Cascadia Code', 'Fira Code', monospace" font-size="13" font-weight="400" fill="#7dcfff">Full Stack Engineer @ Riamona</text>
<rect x="579" y="92" width="2.5" height="17" fill="#7aa2f7" class="cursor"/>
</g>
<g class="phrase-1" style="opacity: 0;">
<text x="460" y="105" text-anchor="middle" font-family="'Cascadia Code', 'Fira Code', monospace" font-size="13" font-weight="400" fill="#7dcfff">7th of 31,000+ - Meta PyTorch Hackathon</text>
<rect x="618" y="92" width="2.5" height="17" fill="#7aa2f7" class="cursor"/>
</g>
<g class="phrase-2" style="opacity: 0;">
